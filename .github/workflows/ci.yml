# CI (US-11): el mismo gate que en local, `just check` (US-10), en cada Pull
# Request y en cada push a main. El workflow no reimplementa ningún paso: solo
# prepara las herramientas y llama recetas del justfile.
#
# Cada paso de `check` y cada build es un step propio (US-109): `just check <id>`
# corre ese paso de la misma lista que usa `just check` en local. GitHub corta en
# el primer step rojo, como el corte local, y `just check resumen` escribe al
# final la tabla de la corrida (pasos, duración y pruebas).
#
# Postgres va por `just db-up` (docker compose), no por un service container:
# la precondición de `check` usa `docker compose exec postgres`, y así la imagen
# fijada y la migración (pg_trgm + schema + seed + VACUUM) son las de local.
#
# Las actions van fijadas por SHA completo, con el tag en el comentario: un tag
# es mutable (incidente tj-actions/changed-files).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# En un PR, un push nuevo cancela la corrida anterior de esa rama. En main no se
# cancela nada (US-110): cada commit tiene que terminar y publicar sus imágenes.
# Con el SHA en el grupo, cada commit de main es su propio grupo. Con
# cancel-in-progress: false no bastaría, porque GitHub igual cancela las
# corridas pendientes que se acumulan detrás de la que está corriendo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Fija, no `ubuntu-latest`: esa etiqueta cambia de imagen sin aviso (US-109).
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Credencial local del Postgres de docker-compose.yml (packages/db/.env.example),
      # no un secreto. Los tests de packages/db la leen de packages/db/.env, que en
      # el runner no existe; `just db-test` también la toma de aquí.
      DATABASE_URL: postgresql://safari:safari@localhost:5433/safari_scraper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Caché de las descargas de yarn v1 (los dos lockfiles); no de node_modules.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: |
            apps/yarn.lock
            apps/api/rest/yarn.lock

      # Segunda llamada solo para la caché de npm de packages/db: setup-node
      # admite un gestor por llamada. La versión de Node es la misma.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/db/package-lock.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/scraper-worker/requirements.txt

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.54.0

      - name: Versiones
        run: node --version && yarn --version && npm --version && python --version && just --version && docker compose version

      # Lockfiles congelados: falla si un package.json no coincide con su lockfile.
      - run: just install-ci

      # Red por si --frozen-lockfile de yarn v1 con workspaces deja pasar algo:
      # ninguna instalación puede cambiar un archivo versionado.
      - name: Árbol limpio tras instalar
        run: git status --porcelain && git diff --exit-code

      - run: just db-up

      # Cada paso deja su resultado aquí, y vitest sus conteos, para el resumen.
      - name: Preparar el resumen
        run: echo "CHECK_REPORT=$RUNNER_TEMP/check-report.txt" >> "$GITHUB_ENV"

      - name: Build de packages/db
        run: just check db-build
      - name: Lint de packages/db
        run: just check db-lint
      - name: Typecheck de packages/db
        run: just check db-typecheck
      - name: Typecheck de la API
        run: just check api-typecheck
      - name: Lint de la API
        run: just check api-lint
      - name: Lint del admin
        run: just check admin-lint
      - name: Lint de la tienda
        run: just check shop-lint
      - name: Pruebas de la API
        run: just check api-test
      - name: Pruebas de packages/db
        run: just check db-test
      - name: Prueba del pipeline del scraper
        run: just check scraper-test

      # Los .env de la tienda, el admin y la API, desde sus plantillas: los builds
      # de Next leen de ahí sus NEXT_PUBLIC_*. Van después de las pruebas para que
      # nada de lo anterior dependa de ellos.
      - name: Crear los .env desde las plantillas
        run: just env

      - name: Build de la API
        run: just check api-build
      # Sin APPLICATION_MODE=production (el de la plantilla), next build no
      # ignora los errores de TypeScript: este step vigila los tipos de la tienda.
      # El admin no se puede (TS2688 de minimatch) y sigue con el de la plantilla.
      - name: Build del admin
        run: just check admin-build
      - name: Build de la tienda
        run: just check shop-build
        env:
          APPLICATION_MODE: development

      - name: Resumen
        if: always()
        run: just check resumen

  # Imágenes de la API, la tienda y el admin (US-110). Se construyen siempre,
  # para detectar un Dockerfile roto antes del merge, y se publican en Docker
  # Hub solo desde main (push, o workflow_dispatch sobre main), con la etiqueta
  # sha-<7 primeros del commit>. Sin `latest`: el despliegue apunta a un SHA.
  images:
    needs: check
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      # Publicar: push a main, o dispatch sobre main. Nunca en pull_request.
      # PRUEBA CA-6 (NO MERGEAR): fuerza el camino de publicación.
      PUBLICAR: true
      # En un fork no se publica: no tiene las credenciales del dueño (US-110 D-6).
      ES_FORK: ${{ github.event.repository.fork }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # La etiqueta y el repositorio de destino. En un PR (o un fork) no hay
      # usuario de Docker Hub: el nombre local `safari` no se publica nunca.
      - name: Etiqueta y destino
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "REGISTRO=${DOCKERHUB_USERNAME:-safari}" >> "$GITHUB_ENV"
          if [ "$PUBLICAR" = true ] && [ "$ES_FORK" = true ]; then
            echo "SUBIR=false" >> "$GITHUB_ENV"
            echo "::notice::Repositorio fork: se construyen las imágenes, pero no se publican."
            echo "> Repositorio fork: las imágenes se construyeron, pero no se publicaron (US-110 D-6)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SUBIR=$PUBLICAR" >> "$GITHUB_ENV"
          fi

      # Falla aquí, y con un mensaje que los nombra, si faltan las credenciales:
      # no en el login ni en el push. Los secretos no se pueden usar en `if:`, así
      # que llegan por env y se comprueban en shell.
      - name: Credenciales de Docker Hub
        if: env.SUBIR == 'true'
        env:
          # PRUEBA CA-6 (NO MERGEAR): un secreto que no existe.
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_QUE_NO_EXISTE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          falta=0
          [ -n "$DOCKERHUB_TOKEN" ] || { echo "::error::Falta el secreto DOCKERHUB_TOKEN (Settings → Secrets and variables → Actions). Guía: docs/github/secretos-github-actions.md"; falta=1; }
          [ -n "$DOCKERHUB_USERNAME" ] || { echo "::error::Falta la variable DOCKERHUB_USERNAME (Settings → Secrets and variables → Actions → Variables). Guía: docs/github/secretos-github-actions.md"; falta=1; }
          exit "$falta"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.SUBIR == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Los tres en el mismo builder: la etapa `deps` de la tienda y el admin es
      # idéntica y se hace una sola vez. La caché de Actions (type=gha) solo se
      # escribe desde main; los PR la leen y no escriben la suya, para no llenar
      # el tope del repo. Sin el secreto extra_ca: es opcional (required=false).
      # provenance: false deja un manifiesto simple, sin la entrada unknown/unknown.
      - name: Imagen de la API
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/rest/Dockerfile
          platforms: linux/amd64
          push: ${{ env.SUBIR == 'true' }}
          provenance: false
          tags: ${{ env.REGISTRO }}/safari-api:${{ env.IMAGE_TAG }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: ${{ env.SUBIR == 'true' && 'type=gha,mode=max,scope=api' || '' }}

      - name: Imagen de la tienda
        id: shop
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/shop/Dockerfile
          platforms: linux/amd64
          push: ${{ env.SUBIR == 'true' }}
          provenance: false
          tags: ${{ env.REGISTRO }}/safari-shop:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: |
            type=gha,scope=shop
            type=gha,scope=admin
          cache-to: ${{ env.SUBIR == 'true' && 'type=gha,mode=max,scope=shop' || '' }}

      - name: Imagen del admin
        id: admin
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/admin/rest/Dockerfile
          platforms: linux/amd64
          push: ${{ env.SUBIR == 'true' }}
          provenance: false
          tags: ${{ env.REGISTRO }}/safari-admin:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: |
            type=gha,scope=admin
            type=gha,scope=shop
          cache-to: ${{ env.SUBIR == 'true' && 'type=gha,mode=max,scope=admin' || '' }}

      - name: Resumen de las imágenes
        if: always()
        env:
          DIGEST_API: ${{ steps.api.outputs.digest }}
          DIGEST_SHOP: ${{ steps.shop.outputs.digest }}
          DIGEST_ADMIN: ${{ steps.admin.outputs.digest }}
        run: |
          {
            echo "### Imágenes ($IMAGE_TAG)"
            echo ""
            if [ "$SUBIR" = true ]; then echo "Publicadas en Docker Hub."; else echo "Construidas sin publicar (evento \`$GITHUB_EVENT_NAME\`, rama \`$GITHUB_REF_NAME\`)."; fi
            echo ""
            echo "| Imagen | Digest |"
            echo "|---|---|"
            echo "| \`$REGISTRO/safari-api:$IMAGE_TAG\` | \`${DIGEST_API:-—}\` |"
            echo "| \`$REGISTRO/safari-shop:$IMAGE_TAG\` | \`${DIGEST_SHOP:-—}\` |"
            echo "| \`$REGISTRO/safari-admin:$IMAGE_TAG\` | \`${DIGEST_ADMIN:-—}\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
