# openspec/config.yaml
# SDD configuration for safari-marketplace
# Managed by SDD init. Update via sdd-init or manual edits; do not delete.

schema: spec-driven

project:
  name: safari-marketplace
  git_remote: https://github.com/rcuello/safari-marketplace.git
  branch: main
  # openspec-only: el MCP de Engram NO esta conectado en esta maquina.
  # Todo artefacto SDD persiste exclusivamente en openspec/ (specs/ + changes/).
  # Si algun archivo de .claude/skills/_shared/ menciona Engram, esa rama no aplica aqui.
  artifact_store_mode: openspec

# Context block kept under 10 lines. Describes implemented tech stack and conventions.
context: |
  Tech stack: monorepo didactico de sistemas distribuidos. Next.js 13.5 (apps/shop, apps/admin),
  NestJS 9 (apps/api), Prisma 7 + adapter-pg (packages/db), Scrapy+Playwright (services/scraper-worker),
  PostgreSQL 16 en Docker (puerto 5433). Orquestacion de tareas con `just` (justfile en la raiz).
  Fuente de verdad del DDL: db/schema.sql (aplicado por `just db-migrate`); Prisma se re-introspeciona.
  Docs y prosa en espanol neutral; identificadores/slugs/archivos en ingles kebab-case.
  Backlog de producto en docs/product/ (epicos + US con CA numerados y DoD con evidencia real).

strict_tdd: false   # no hay runner de tests repo-wide todavia (ver testing.test_command)

testing:
  framework: mixed             # vitest (packages/db y apps/api/rest, 34 archivos), script Python (scraper)
  # PENDIENTE: no existe un comando de test repo-wide. Los tests reales hoy (medidos 2026-10-24,
  # rama lint-formato-api-db):
  #   - packages/db: `npm test` (vitest; 10 archivos: 9 *.integration.test.ts + products.repository.test.ts;
  #     requiere `just db-up` antes) -> envuelto en `just db-check` (typecheck + tests)
  #   - apps/api/rest: `cd apps/api/rest && npx vitest run` (34 archivos / 565 tests; mockean @safari/db,
  #     no requieren Postgres). SIN receta de `just` que lo envuelva.
  #     Su vitest.config.ts (unplugin-swc, US-88) resuelve `@db/*` y `src/*` con alias; consume el
  #     packages/db/dist construido (requiere `just db-build` antes). No hay suite de auth.
  #     SWC transpila sin comprobar tipos: las redes de tipos de los specs (p. ej. KeyDrift de
  #     become-seller) las dispara `npx tsc --noEmit -p tsconfig.json`, no `vitest run`.
  #   - scraper: `just db-test` (services/scraper-worker/test_pipeline.py; requiere `just db-up`).
  #     El pipeline ya upserta en `products` (US-6); lo que sigue consultando `productos` es
  #     `just db-count` (US-8, pendiente).
  # Crear el gate agregador (`just check`) es una US del backlog (Epico 9 / US-10).
  test_command: "just db-check"   # el unico gate envuelto en una receta de `just` (requiere just db-up); el vitest de la API se corre aparte
  coverage_command: ""            # not yet configured
  build_command: "just build"     # build de produccion shop + admin (build-api aparte; exige la API arriba)
  coverage_threshold: 0
  layers:
    unit: true                 # apps/api/rest: vitest con @safari/db mockeado (34 archivos / 565 tests); packages/db: products.repository.test.ts
    integration: true          # packages/db/src/**/*.integration.test.ts (9 archivos; vitest + Postgres real)
    e2e: false                 # `just verify` comprueba los 3 servicios levantados, pero es manual, no una suite
  quality:
    # Lint SIN escribir (el que exige la DoD; ver rules.apply.lint_commands):
    #   packages/db   -> npm run lint   (biome check .)
    #   apps/api/rest -> npx eslint "{src,apps,libs,test}/**/*.ts"   (NUNCA `yarn lint`: lleva --fix y reescribe)
    #   apps/shop y apps/admin/rest -> yarn lint   (next lint)
    linter: true
    type_checker: true         # tsc --noEmit en packages/db (`npm run typecheck`); resto solo via build
    # Formateadores: biome `npm run format` en packages/db; prettier 2.8 `yarn format` en apps/api/rest;
    # prettier 2.4.0 de apps/node_modules en shop/admin (prettier.config.js de cada app; el 3.3.3 local
    # de cada app NO es el que dejo ese codigo en 0). El hook PostToolUse
    # .claude/hooks/post-tool-use/format-edited-file.cjs pasa el formateador correspondiente sobre
    # cada archivo que el agente edita; no sustituye al lint de la DoD.
    formatter: true

rules:
  proposal:
    - Include rollback plan for risky changes
    - Respect US scope strictly; "NO incluye" is binding (no drive-by improvements)
    - 1 US = 1 agent session; never mix two US in one change
  specs:
    - Use Given/When/Then (Gherkin) for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Spanish specs are allowed (project convention); SDD artifacts default to English otherwise
  design:
    - db/schema.sql es la fuente de verdad del DDL; packages/db/prisma/schema.prisma se regenera con `prisma db pull` + renombres, nunca genera migraciones
    - Las CHECK constraints que Prisma no modela se validan en los repositorios de packages/db y se traducen a errores de dominio
    - El scraper escribe en las MISMAS tablas que consulta la tienda (products + source_*); no crea esquema propio
    - La API publica snake_case (contrato heredado del frontend); la capa de datos devuelve camelCase; la traduccion vive en los servicios de Nest
    - Los contratos HTTP existentes se preservan byte a byte al migrar endpoints del mock a Postgres (precedente: /api/settings)
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    tdd: false                 # strict_tdd es false hasta que exista un runner repo-wide
    # Inner loop por paquete (elegir segun el area tocada):
    #   packages/db  -> cd packages/db && npm test          (vitest; requiere just db-up)
    #   scraper      -> just db-test                        (hoy roto: ver testing.test_command)
    #   apps/api     -> cd apps/api/rest && npx vitest run (34 archivos / 565 tests; sin receta de just) + build + curl contra el endpoint
    test_command: "just db-check"
    follow_existing_patterns: true
    # Formato y lint (docs/product/README.md, paso 5 del protocolo). El hook PostToolUse
    # .claude/hooks/post-tool-use/format-edited-file.cjs formatea cada archivo al editarlo;
    # aun asi, antes de reportar, el lint SIN escribir de los paquetes tocados debe dar 0 problemas.
    # La API NUNCA se verifica con `yarn lint`: lleva --fix y reescribe archivos.
    lint_commands:
      - cd packages/db && npm run lint
      - cd apps/api/rest && npx eslint "{src,apps,libs,test}/**/*.ts"
      - cd apps/shop && yarn lint
  verify:
    # No hay runner quiet-mode como en otros repos. La evidencia de cierre es la salida
    # REAL de los comandos: just db-check / just db-test / just verify / curl contra
    # los endpoints, pegada en el reporte. "Deberia funcionar" no cierra una US.
    test_command: "just db-check"
    build_command: "just build"
    coverage_threshold: 0
    require_evidence: true
    # Lint SIN escribir en 0 en los paquetes tocados; cualquier otro resultado es CRITICAL.
    # Mismos comandos que rules.apply.lint_commands; en la API nunca `yarn lint` (lleva --fix).
    lint_commands:
      - cd packages/db && npm run lint
      - cd apps/api/rest && npx eslint "{src,apps,libs,test}/**/*.ts"
      - cd apps/shop && yarn lint
  archive:
    - Warn before merging destructive deltas
    - Archive is an audit trail; never delete or modify archived changes
