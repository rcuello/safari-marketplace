# === DECISION DE ENTREGA (usuario, 2026-09-09, Review Workload Guard) ===
delivery_decision:
  outcome: chained-prs
  slices: 3
  chain_strategy: stacked-to-main
  size_exception: false
  # PR#1a (~245) -> PR#1b (~240) -> PR#2 (~410).
  # Cada slice lo prueba verde un runner distinto:
  #   PR#1a: `just db-check` solo (aun no existen funciones de escritura)
  #   PR#1b: `just db-build` + `just db-check` (base = rama de PR#1a)
  #   PR#2:  `npx jest` + `just build-api` + `curl` (base = rama de PR#1b)
  # CONSECUENCIA ACEPTADA de stacked-to-main (se le expuso al usuario al
  # elegir): main avanza de forma incremental, asi que PR#1a puede quedar
  # fusionado en main con domain-errors.ts y slug.ts SIN consumidor hasta que
  # entre PR#1b. Es inerte (no lo importa nadie), no roto.
  # PRECEDENTE del repo para una cadena de 3: US-4a del Epico 1 aterrizo como
  # 3 PRs encadenados (~135 / ~250 / ~205), registrado en su README.
  #
  # SKILL NO RESOLUBLE, declarado: el workflow marca `chained-pr` (skill de
  # registro `gentle-ai-chained-pr`) como match requerido cuando se eligen PRs
  # encadenados, y hay que pasarlo por ruta de registro sin hardcodearla. En
  # esta maquina NO EXISTE: no hay .atl/skill-registry.md, no hay nada en
  # .claude/skills/ y no hay nada en ~/.claude/skills/ (la unica coincidencia
  # de "chain" es un archivo de memoria de otro proyecto). No se invento una
  # ruta. sdd-apply se guia por el precedente de US-4a y por las fronteras de
  # slice que fija tasks.md.
  apply:
