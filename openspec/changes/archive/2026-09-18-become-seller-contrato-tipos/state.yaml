  design:
    status: done
    artifact: openspec/changes/become-seller-contrato-tipos/design.md
    # 3152 palabras (bajo el techo de 3600 de sdd-design). Opcion A (D-1) sin
    # reinterpretar; D-2/D-3/D-4/D-5 heredadas del proposal.
    #
    # TODA afirmacion sobre TypeScript se COMPILO con el tsc del repo
    # (apps/api/rest/node_modules/.bin/tsc, typescript 4.7.4) sobre una maqueta
    # con las opciones reales de apps/api/rest/tsconfig.json, en el scratchpad
    # (NO se escribio nada bajo apps/). Toda afirmacion sobre OpenAPI se leyo
    # del /docs-json VIVO (200, 170326 B, misma cifra que la exploracion; la
    # API ya estaba arriba, no se arranco nada).
    #
    # DECISIONES CERRADAS:
    #   D-6 (la que el proposal dejo abierta) CERRADA: clase local
    #       BecomeSellerImage {thumbnail, original, id, file_name}, NO
    #       Attachment. Razon medida: /docs-json publica
    #       Attachment.required = ["id","created_at","updated_at"], asi que
    #       reutilizarla no solo perderia file_name -- INVENTARIA dos campos
    #       obligatorios que ninguna de las 6 imagenes del modulo tiene.
    #       Coste declarado: duplica el concepto de adjunto (deuda ya
    #       registrada). attachment.entity.ts NO se toca.
    #   D-7 NULABILIDAD: @ApiProperty({type: String, nullable: true}) es
    #       OBLIGATORIO (unico decorador del change). Razon dura: el tsconfig
    #       de la API NO activa strict/strictNullChecks, asi que el checker
    #       reduce `string | null` a `string` ANTES de que el plugin lo lea --
    #       nullable no puede inferirse ni por accidente. Tabla en el design
    #       separa @ApiProperty (lo lee SwaggerModule.createDocument una vez en
    #       el arranque, no puede rechazar peticiones) de class-validator (lo
    #       lee ValidationPipe en cada peticion). Verificacion: solo tras
    #       just build-api + curl /docs-json siguiendo $ref (nunca en ts-jest).
    #       Contingencia acotada: ninguna CA depende de nullable; si el plugin
    #       lo ignora, se retira y se reporta.
    #   D-8 HALLAZGO NUEVO Y BLOQUEANTE (el proposal no lo vio): el limite
    #       jsonb NO se puede cruzar sin escape. Compilado: una clase no es
    #       asignable a Prisma.InputJsonValue ("Index signature for type
    #       'string' is missing") ni Prisma.JsonValue a una clase; el spread
    #       {...x} tampoco (falla un nivel mas abajo, donde banner vuelve a ser
    #       clase). ESA es la razon real de los dos `as` de US-44. Solucion:
    #       4 guardas de tipo a nivel de modulo con parametro `unknown`
    #       (_isBecomeSellerOptions, _isCommissionList, _isJsonObject,
    #       _isJsonArray). Con `unknown` el predicado es legal; con
    #       Prisma.JsonValue daria TS2677. Maqueta compilada en verde con
    #       _toEnvelope() sin un solo `as` y create() leyendo el DTO tipado.
    #       COSTE declarado: el change NO es 100% inerte en runtime como decia
    #       el proposal -- la guarda de escritura sustituye al `!== undefined`
    #       del spread condicional, asi que un body con page_options no-objeto
    #       pasa de reenviarse a Prisma a omitirse. Nunca un 4xx nuevo, nunca
    #       class-validator.
    #   D-9 HALLAZGO NUEVO: `Banner` YA EXISTE como schema global
    #       (types/entities/type.entity.ts:16, referenciado por Type.banners).
    #       components.schemas es un espacio PLANO de 185 nombres: un segundo
    #       Banner corromperia la documentacion de /api/types (regresion FUERA
    #       del modulo con el diff dentro). Regla: toda clase NUEVA lleva
    #       prefijo BecomeSeller; las existentes conservan nombre. Nombres
    #       verificados libres hoy. R2 bendice el renombre (los $ref se
    #       resuelven desde paths, nunca por nombre fijo).
    #   D-10 RED DE CA-3 (concreta D-4): AssertSameKeys con KeyDrift =
    #       Exclude<keyof T,K> | Exclude<K,keyof T>, envuelto en [X] extends
    #       [never] (evita distribucion), rama falsa devuelve la union de
    #       claves a la deriva -> EL ERROR NOMBRA LA CLAVE. Las 24 claves NO se
    #       escriben a mano en el tipo: se derivan con keyof typeof del JSON
    #       importado. Vive en become-seller.service.spec.ts (tsconfig.build
    #       excluye **/*spec.ts, asi que el rojo lo da npx jest via ts-jest sin
    #       isolatedModules). Sin `satisfies`. ROJO/VERDE YA MEDIDOS:
    #         quitar contact -> TS2322 Type 'true' is not assignable to type '"contact"'
    #         typo contacto  -> TS2322 ... type '"contacto"'
    #         commissions->missions en el DTO -> TS2322 ... type 'KeyDrift<Dto, ...>'
    #         restaurar -> EXIT=0
    #       Complemento medido: asignar el JSON real al DTO tipado detecta
    #       deriva de TIPO (max_balance:number -> TS2322 'string' is not
    #       assignable to 'number'), y Object.keys en runtime pin-ea los 24
    #       nombres.
    #   D-11 El spec construye sus fixtures desde @db/become-seller.json
    #       (compila sin cast, comprobado): fuera createDto() y los `as never
    #       as`. makeRecord() no cambia (BecomeSellerRecord sigue siendo
    #       JsonValue y sus objetos parciales pasan las guardas).
    #   D-12 update-become-seller.dto.ts: CERO lineas de diff (PartialType se
    #       corrige solo); metodos muertos update/findOne/remove intactos.
    #
    # INVENTARIO: 13 clases en become-seller.entity.ts (7 nuevas, 4
    # modificadas, 1 sin cambio de forma, 1 reescrita). CommissionItem pasa a
    # class con created_at/updated_at STRING (en el JSON de commissions son
    # texto) y NO extiende CoreEntity. BecomeSellerEnvelope extends CoreEntity:
    # /docs-json de hoy demuestra que Nest APLANA la herencia (no existe schema
    # CoreEntity), asi que saldran las 5 props planas que pide R2.
    # icon:{value} se deja inline (el plugin ya lo serializa bien hoy).
    #
    # TAMANO REVISADO AL ALZA, con causa: ~250 inserciones / ~114 borrados =
    # ~364 lineas cambiadas (entidad ~190, spec ~80, servicio ~72, dto ~22).
    # La horquilla ~230-260 del proposal contaba el tamano FINAL de la entidad
    # (55->120), no insertions+deletions de una reescritura. NO es la causa que
    # el proposal anticipaba (duplicar clases): se declaran una sola vez y el
    # DTO las importa. El exceso sale de D-8 (~12 lineas) y de 13 clases a una
    # propiedad por linea.
    #   400-line budget risk: Medium (margen ~36 lineas).
    #   Chained PRs recommended: No -- single-pr se mantiene.
    #
    # No se toco ningun archivo bajo apps/, packages/, db/, openspec/specs/ ni
    # openspec/changes/archive/. Unicos writes: design.md y este bloque.
    #
    # ---- GATEKEEPER (revisor de contexto fresco, 2026-09-18) ----
    # Veredicto: PASS WITH CONCERNS. Sin re-run. Gates: alucinacion PASS
    # (todas las citas archivo:linea verificadas una a una), drift PASS
    # (D-1..D-5 honradas; D-6 y nullability cerradas legitimamente; nada
    # settled fue revocado), scope PASS.
    # Reprodujo con el tsc real (4.7.4) las 4 filas rojo/verde de la red CA-3
    # y los 3 errores de asignabilidad de Prisma: identicos byte a byte.
    #
    # D-8 CONFIRMADO, y la necesidad es MAS fuerte de lo que el diseno
    # argumenta: probo 3 escapes mas ligeros y los 3 fallan (mapped type
    # Plain<T> cae en `banner`; launderer generico TS2345; y un cast unico
    # localizado `as BecomeSellerOptions` es IMPOSIBLE -- los tipos no son
    # comparables en ninguna direccion, asi que TS exige el salto por
    # `unknown`, que es justo lo que el grep de CA-3 caza). Reduccion que el
    # diseno no vio: las dos guardas de escritura colapsan en una sola
    # (`value is Prisma.InputJsonObject | Prisma.InputJsonArray`) -> 3
    # guardas, no 4. Compila verde.
    # MATIZ IMPORTANTE sobre el delta runtime: el diseno dice "no aparece
    # ningun 4xx nuevo" (cierto), pero lo que de verdad cambia es que
    # DESAPARECE UN 500 existente: hoy `page_options: null` se reenvia y
    # Prisma lanza -> 500; tras la guarda se descarta en silencio -> 201. Y
    # `page_options: "texto"` hoy corrompe el jsonb sin lanzar. El "NO
    # incluye" de la US dice que cambiar la superficie de error del POST
    # "merece su propia decision" -> NOMBRAR este delta en la descripcion del
    # PR, no solo el mecanismo.
    #
    # D-9 CONFIRMADO contra /docs-json en vivo (185 schemas): `Banner` existe,
    # es plano, y `Type.banners` lo $ref-encia. Los 8 nombres nuevos estan
    # libres. Matiz: `Showcase`/`GuidelineItem`/`UserStory`/`Contact` sin
    # prefijo TAMBIEN estan libres hoy -- el prefijo es convencion defensiva,
    # no necesidad estricta.
    #
    # LOC PARCIALMENTE CONFIRMADO: escribio la entidad completa de 13 clases
    # -> 108 lineas peladas. El +60 del spec es el numero debil (el toEqual de
    # 24 nombres ~26 + AssertSameKeys ~12 + fixture ~8 + it() ~6 = ~52 ANTES
    # de reescribir los 3 fixtures de create()); presupuestar +75-85. Total
    # realista ~375-395, no 364: el margen real bajo 400 es ~5-25 lineas, no
    # ~36. La etiqueta Medium sigue siendo correcta.
    #
    # LO QUE APPLY TENDRIA QUE IMPROVISAR (cerrarlo en sdd-tasks):
    #  1. `CommissionItem.id`: el dato es number, la entidad actual dice
    #     `id?: string`; el diseno no lo anota. El fixture D-11 lo fuerza.
    #  2. Los tipos escalares de las 24 claves internas nunca se listan
