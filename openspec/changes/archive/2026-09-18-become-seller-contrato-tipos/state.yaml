  spec:
    status: done
    artifact: openspec/changes/become-seller-contrato-tipos/specs/become-seller-contract-types/spec.md
    # 995 palabras (bajo el presupuesto de 1000/capacidad de sdd-spec).
    # New Capability become-seller-contract-types, delta con SOLO
    # ADDED Requirements (become-seller-page-api no se toca: sin
    # MODIFIED/REMOVED, congela el contrato HTTP tal como fija el proposal).
    #
    # 5 requirements, mapeados 1:1 a CA-1..CA-4 del US (D-1..D-6 del
    # proposal ya vienen incorporados como el "como" detras de cada MUST):
    #   R1 La entidad y el DTO describen el payload real (CA-1) -- 2 escenarios
