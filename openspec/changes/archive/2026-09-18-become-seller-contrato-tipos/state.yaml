    #       nivel interno) rechazadas con la evidencia de la exploracion.
    #   D-2 CommissionItem pasa de interface a class. BLOQUEADOR de CA-2: el
    #       plugin CLI de @nestjs/swagger solo emite _OPENAPI_METADATA_FACTORY
    #       para clases; como interfaz el schema degenera a {type:array,
    #       items:{type:object}} sin $ref y max_balance NUNCA puede salir como
    #       type:"string". Declarado como ADICION EXPLICITA a la tabla
    #       "Archivos a crear / modificar" de la US (consecuencia necesaria de
    #       CA-2, no scope creep).
    #   D-3 max_balance: string a secas (NO string|number). Una union
    #       serializaria como {oneOf:[...]} e incumpliria la literalidad de
    #       CA-2. Es lo persistido en los dos tiers y lo que valida el yup del
    #       admin. El default numerico 0 del formulario del admin queda fuera.
    #   D-4 Red de CA-3: asercion a nivel de tipo (keyof/Exclude enumerando las
    #       24 claves, falla en AMBAS direcciones) + Object.keys en runtime. El
    #       test naive (asignar el JSON importado o un spread) NO falla a
    #       compilacion -- probado en la exploracion. NO usar `satisfies`
    #       (typescript ^4.7.4; llego en 4.9). sdd-design elige entre la
    #       asercion keyof y el literal a mano de 24 claves. El DoD exige
    #       demostrar el rojo provocado y el verde restaurado.
    #   D-5 El comentario reescrito de become-seller.service.ts:12-23 NO debe
    #       repetir la subcadena literal "as unknown as" (ni en pasado ni
    #       negada): el grep de cierre de CA-3 coincide con comentarios y daria
    #       falso positivo.
    #   D-6 Tipado de imagenes (Attachment sin file_name) queda ABIERTO para
    #       sdd-design: usar Attachment y aceptar la divergencia heredada, o
    #       declarar la forma local {id, thumbnail, original, file_name}. Ambas
    #       respetan el scope (attachment.entity.ts no se toca en ningun caso).
    #
    # CAPABILITIES (contrato con sdd-spec):
    #   New:      become-seller-contract-types
    #   Modified: None -- become-seller-page-api congela el contrato HTTP y este
