  tasks:
    status: done
    artifact: openspec/changes/become-seller-contrato-tipos/tasks.md
    # 6 fases, numeracion jerarquica: 0 captura-antes (3), 1 entidad (6),
    # 2 dto (1), 3 servicio (6), 4 spec (4), 5 verificacion (11), 6 reporte
    # (1) = 32 tareas. Fase 0 va primero por instruccion explicita (sin
    # captura fresca, el deepStrictEqual de CA-4 no tiene contra que
    # comparar).
    #
    # LOS 6 HUECOS DEL GATEKEEPER, CERRADOS CON DATOS REALES (node -e sobre
