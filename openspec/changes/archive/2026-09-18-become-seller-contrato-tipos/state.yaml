  propose:
    status: done
    artifact: openspec/changes/become-seller-contrato-tipos/proposal.md
    # 1447 palabras (bajo el presupuesto de 1450 de sdd-propose).
    #
    # DECISIONES FIJADAS (el proposal las numera D-1..D-6):
    #   D-1 Opcion A adoptada: las clases del objeto interno (Banner, Showcase,
