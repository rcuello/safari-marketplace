    #
    # DISEÑO: 3 opciones comparadas para compartir las clases del objeto
    # interno (identico en GET y POST, verificado) entre entidad y DTO:
    #   A) clases compartidas en become-seller.entity.ts, importadas por el
    #      DTO (patron ya usado hoy: el DTO ya importa BecomeSeller de la
    #      entidad) -- RECOMENDADA. Cero archivos nuevos, entra en la tabla
    #      de 5 archivos del US, reutiliza CoreEntity bajado al nivel
    #      correcto (BecomeSellerEnvelope) en vez de inventar un envoltorio
    #      generico.
    #   B) modulo compartido nuevo (become-seller-options.entity.ts) --
    #      descartada: anade un archivo que la tabla del US no lista, sin
    #      beneficio real con un solo consumidor por lado.
    #   C) PickType/OmitType/IntersectionType a nivel del objeto interno --
    #      descartada con evidencia: el objeto interno es IDENTICO en GET y
    #      POST, no hay subconjunto que recortar; seria indireccion sin
    #      funcion.
    #
    # CA-3 (red de regresion): moduleNameMapper confirma @db/become-seller.json
    # resuelve al mock REAL (rootDir:src -> src/db/pickbazar/$1); ts-jest
    # SIN isolatedModules (type-check completo); resolveJsonModule +
    # esModuleInterop activos. PERO: TypeScript NO aplica excess-property-
    # checking a variables/spreads/imports, solo a literales escritos a
    # mano -- un test naive que asigne el JSON importado (via spread) al
    # tipo del DTO NO fallara a compilacion si se borra una clave de
    # BecomeSellerOptions (subtipado estructural permite lo "mas ancho" en
    # lo "mas angosto"). Se necesita un chequeo a nivel de tipo (keyof
    # Exclude<>) o un literal a mano con las 24 claves explicitas. NO usar
    # `satisfies`: no existe en este repo (typescript ^4.7.4 en
    # apps/api/rest/package.json, satisfies llego en TS 4.9).
    #
    # DECISION ABIERTA marcada para sdd-design: max_balance string vs
    # string|number. CA-2 dice literalmente type:"string" (sin oneOf); una
    # union string|number probablemente serialice como oneOf via el plugin
